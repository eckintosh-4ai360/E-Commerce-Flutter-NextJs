name: eckintosh
description: eckintosh - Beautiful Leather Bags & Accessories

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  badges: ^3.1.2
  carousel_slider: ^4.2.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  lottie: ^3.0.0
  animate_do: ^3.3.4
  flutter_rating_bar: ^4.0.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
