name: eckintosh
description: eckintosh - Beautiful Leather Bags & Accessories

publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.2.2
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  intl: ^0.20.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  share_plus: ^13.0.0
  device_preview: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
